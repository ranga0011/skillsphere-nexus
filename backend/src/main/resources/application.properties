spring.application.name=skill-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skillsphere_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.security.jwt.secret=${JWT_SECRET}

management.endpoints.web.exposure.include=health,info
app.certificates.issuer=${CERTIFICATE_ISSUER:SkillSphere Nexus}
app.certificates.passing-percentage=${CERTIFICATE_PASSING_PERCENTAGE:70}
app.certificates.font-path=${CERTIFICATE_FONT_PATH:}

# Outbound Gmail SMTP Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.sender.name=${SPRING_MAIL_SENDER_NAME:SkillSphere Nexus Assessment Engine}
