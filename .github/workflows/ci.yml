name: SkillSphere Nexus CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend CI (Java 25 & Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Execute Automated Unit & Integration Tests
        run: ./mvnw clean test -B

      - name: Build & Package Spring Boot Executable JAR
        run: ./mvnw package -DskipTests -B

      - name: Upload Backend Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 2

  frontend-ci:
    name: Frontend CI (Node 22 & Angular 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Production Angular Bundle
        run: npm run build -- --configuration production

      - name: Upload Production Web Distribution
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/angular-test/browser
          retention-days: 2

  docker-verification:
    name: Docker Multi-Container Stack Validation
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target

      - name: Download Frontend Distribution
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/angular-test/browser

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Containers
        run: docker compose build
